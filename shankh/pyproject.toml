[project]
name = "shankh"
version = "0.1.0"
description = "Credentials that stolen malicious packages reach quarantine and deactivate themselves."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
shankh = "shankh.cli:app"
shankhd = "shankh.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shankh"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = [
    "network: test hits a real external service (PyPI) -- skips itself if offline, but needs it to pass",
]
